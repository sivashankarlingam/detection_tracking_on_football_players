services:
  # Web service
  - type: web
    name: football-ai-tracker
    env: docker
    region: oregon 
    plan: free
    branch: main
    # releaseCommand: "python manage.py migrate --noinput"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: football-ai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: PORT
        value: "10000"

databases:
  - name: football-ai-db
    databaseName: footballdb
    user: db_user
    region: oregon
    plan: free
