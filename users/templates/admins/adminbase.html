{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Football Player Analysis</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom Glassmorphism CSS -->
    <link rel="stylesheet" href="{% static 'css/glassmorphism.css' %}">
    <!-- DataTables Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
    
    <style>
        .sidebar {
            width: 280px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 2rem 1.5rem;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--glass-border);
            /* Extensive glass styling */
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .main-content {
            margin-left: 280px;
            min-height: 100vh;
            padding: 2rem;
            width: calc(100% - 280px);
        }
        .nav-pills .nav-link {
            color: var(--primary-dark);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-pills .nav-link:hover, .nav-pills .nav-link.active {
            background: rgba(255, 255, 255, 0.8);
            color: var(--primary-main);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transform: translateX(5px);
        }
        .brand-logo {
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #FF4500, #FFA500);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2rem;
            line-height: 1.2;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        .nav-icon {
            font-size: 1.2rem;
        }
    </style>
    <!-- PWA -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#1a202c">
    <link rel="apple-touch-icon" href="{% static 'images/pwa-icon.png' %}">
</head>
<body>
    
    <!-- Glass Sidebar -->
    <nav class="sidebar glass-shadow">
        <a href="{% url 'AdminHome' %}" class="brand-logo mb-4 mt-3">
            <i class="bi bi-shield-lock-fill text-danger text-opacity-75"></i><br>
            System<br>Admin
        </a>
        
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="{% url 'AdminHome' %}" class="nav-link {% if request.resolver_match.url_name == 'AdminHome' %}active{% endif %}">
                    <i class="bi bi-house-door nav-icon"></i> Dashboard Home
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'RegisterUsersView' %}" class="nav-link {% if request.resolver_match.url_name == 'RegisterUsersView' %}active{% endif %}">
                    <i class="bi bi-people nav-icon"></i> User Management
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'index' %}" class="nav-link mt-4 text-danger bg-white bg-opacity-50">
                    <i class="bi bi-box-arrow-right nav-icon"></i> Logout Access
                </a>
            </li>
        </ul>
        
        <div class="mt-auto text-center">
            <!-- Footer removed as per user request -->
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        {% block contents %}
        {% endblock %}
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    
    {% block extra_scripts %}{% endblock %}
    <!-- PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful');
                }, function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
